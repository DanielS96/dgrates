<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Мультивалютный обменник</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { max-width: 100%; overflow-x: hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b3d3d 0%, #1a5c5c 50%, #0d3d3d 100%);
            color: #e2f0e8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            z-index: 0;
        }
        body::before {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            top: -100px;
            left: -100px;
            animation: float1 8s ease-in-out infinite;
        }
        body::after {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #14b8a6, #2dd4bf);
            bottom: -50px;
            right: -50px;
            animation: float2 10s ease-in-out infinite;
        }
        @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(50px,50px); } }
        @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px,-60px); } }
        .container { position: relative; z-index: 1; max-width: 520px; width: 100%; }
        .header { text-align: center; margin-bottom: 32px; }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #6ee7b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .subtitle { color: #99f6e4; font-size: 0.95rem; font-weight: 500; opacity: 0.9; }
        .card {
            background: rgba(15, 45, 45, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(110, 231, 183, 0.2);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(110,231,183,0.1);
        }
        .rate-item {
            background: rgba(10, 30, 30, 0.6);
            border: 1px solid rgba(110, 231, 183, 0.15);
            border-radius: 20px;
            padding: 20px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .rate-item:last-child { margin-bottom: 0; }
        .rate-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(110, 231, 183, 0.6), transparent);
        }
        .rate-label {
            color: #99f6e4;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .rate-value {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #6ee7b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .rate-unit {
            font-size: 1rem;
            color: #6ee7b7;
            font-weight: 500;
            margin-left: 8px;
        }
        .rate-placeholder {
            font-size: 1.1rem;
            color: #5e9e8e;
            font-weight: 500;
        }
        .updated {
            color: #5e9e8e;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .updated::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .rate-value { font-size: 1.5rem; }
            .rate-unit { font-size: 0.85rem; }
            .card { padding: 22px; }
            .rate-item { padding: 16px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Мультивалютный обменник</h1>
            <div class="subtitle">Актуальные курсы</div>
        </div>

        <div class="card">
            <div class="rate-item">
                <div class="rate-label">RUB → USDT</div>
                <div class="rate" id="rate-rub-usdt">
                    <span class="rate-placeholder">Загрузка...</span>
                </div>
            </div>

            <div class="rate-item">
                <div class="rate-label">USDT → EUR</div>
                <div class="rate" id="rate-usd-eur">
                    <span class="rate-placeholder">Загрузка...</span>
                </div>
            </div>

            <div class="rate-item">
                <div class="rate-label">USDT → CNY</div>
                <div class="rate" id="rate-usdt-cny">
                    <span class="rate-placeholder">Загрузка...</span>
                </div>
            </div>

            <div class="updated" id="updated">Обновление...</div>
        </div>
    </div>

    <script>
        async function loadRates() {
            try {
                const response = await fetch('rates_all.json?t=' + Date.now(), {
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache' }
                });
                if (!response.ok) throw new Error('Не удалось загрузить курсы');
                const data = await response.json();

                // Все курсы показываются как "X валюты за 1 USDT"
                displayRate('rate-rub-usdt', data.rub_usdt, 'RUB за 1 USDT');
                displayRate('rate-usd-eur', data.usd_eur, 'EUR за 1 USDT');
                displayRate('rate-usdt-cny', data.usd_cny, 'CNY за 1 USDT');

                if (data.updated_at) {
                    const d = new Date(data.updated_at);
                    document.getElementById('updated').textContent = 'Обновлено: ' + d.toLocaleString('ru-RU');
                } else {
                    document.getElementById('updated').textContent = 'Обновлено: только что';
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                document.getElementById('updated').textContent = '⚠️ Ошибка загрузки данных';
                document.querySelectorAll('.rate').forEach(el => {
                    el.innerHTML = '<span class="rate-placeholder">Недоступно</span>';
                });
            }
        }

        function displayRate(elementId, value, unit) {
            const container = document.getElementById(elementId);
            if (value !== null && value !== undefined && !isNaN(value) && value > 0) {
                container.innerHTML = `<span class="rate-value">${value.toFixed(6)}</span><span class="rate-unit">${unit}</span>`;
            } else {
                container.innerHTML = `<span class="rate-placeholder">Нет данных</span>`;
            }
        }

        loadRates();
        setInterval(loadRates, 30000);
    </script>
</body>
</html>
